{% extends "base.html" %}

{% block title %}Create League - Gaming Tournament & League{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Create New League</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">League Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="game_id">Game</label>
            <select id="game_id" name="game_id" required>
                <option value="">Select a game</option>
                {% for game in games %}
                    <option value="{{ game.id }}" {% if pre_selected_game and pre_selected_game|int == game.id %}selected{% endif %}>{{ game.name }} ({{ game.platform }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="format">League Format</label>
            <select id="format" name="format" onchange="toggleFormat()">
                <option value="round_robin">Round Robin (1v1)</option>
                <option value="ffa">Free For All</option>
            </select>
        </div>
        <div class="form-group" id="num-rounds-group" style="display:none;">
            <label for="num_rounds">Number of Rounds</label>
            <input type="number" id="num_rounds" name="num_rounds" value="1" min="1" max="99">
            <small class="form-help">Each round is a FFA match with all players (1-99)</small>
        </div>
        <div class="form-group">
            <label>Select Players (minimum 2)</label>
            <div class="players-grid">
                {% for player in players %}
                    <label class="player-checkbox">
                        <input type="checkbox" name="players" value="{{ player.id }}">
                        {{ player.name }}
                    </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="btn-primary">Create League</button>
        <a href="/leagues" class="btn-secondary">Cancel</a>
    </form>
</div>

<script>
function toggleFormat() {
    const format = document.getElementById('format').value;
    const roundsGroup = document.getElementById('num-rounds-group');
    roundsGroup.style.display = format === 'ffa' ? 'block' : 'none';
}
</script>
{% endblock %}
