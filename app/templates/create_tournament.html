{% extends "base.html" %}

{% block title %}Create Tournament - Gaming Tournament & League{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Create New Tournament</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Tournament Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="game_name">Game (optional)</label>
            <input type="text" id="game_name" name="game_name" placeholder="e.g., Mario Kart 8 Deluxe">
        </div>
        <div class="form-group">
            <label for="format">Tournament Format</label>
            <select id="format" name="format" required>
                <option value="single_elimination">Single Elimination (Winner's Bracket)</option>
                <option value="double_elimination">Double Elimination (Winner's + Loser's Bracket)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="best_of">Grand Finals Format</label>
            <select id="best_of" name="best_of">
                <option value="1">Single Game (Best of 1)</option>
                <option value="3">Best of 3</option>
            </select>
            <p class="form-help">Only applies to double elimination grand finals</p>
        </div>
        <div class="form-group">
            <label>Select Players (minimum 2)</label>
            <p class="form-help">Recommended: 4, 8, 16, 32, or 64 players for best bracket experience</p>
            <div class="player-selector">
                <input type="text" class="player-search-input" placeholder="Search players by name...">
                <div class="player-search-results"></div>
                <div class="selected-players"></div>
            </div>
        </div>
        <button type="submit" class="btn-primary">Create Tournament</button>
        <a href="/tournaments" class="btn-secondary">Cancel</a>
    </form>
</div>

<script src="{{ url_for('static', filename='js/player_search.js') }}"></script>
{% endblock %}
